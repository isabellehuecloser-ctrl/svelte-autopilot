name: "Svelte Autopilot"
description: "AI code review specialized for Svelte 5 / SvelteKit, on every pull request."
author: "svelte-autopilot"
branding:
  icon: "eye"
  color: "orange"

inputs:
  api-key:
    description: "OpenAI API key. Pass via a repository secret."
    required: true
  model:
    description: "Model used for the review."
    required: false
    default: "gpt-4o-mini"
  github-token:
    description: "Token used to read the PR and post the review. Defaults to the workflow token."
    required: false
    default: ${{ github.token }}
  max-files:
    description: "Maximum number of changed files to review in one run."
    required: false
    default: "20"
  include:
    description: "Comma-separated glob/extension list of files to review."
    required: false
    default: "**/*.svelte,**/*.svelte.ts,**/*.svelte.js,**/*.ts,**/*.js"

outputs:
  findings-count:
    description: "Total number of review findings reported."

runs:
  using: "node20"
  main: "dist/index.js"
